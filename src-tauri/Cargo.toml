[package]
name = "lite-play"
version = "0.1.0"
description = "Lightweight desktop audio player"
edition = "2021"

[lib]
name = "lite_play_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "=2.4.1"
tauri-plugin-single-instance = "=2.5.5"
tauri-plugin-dialog = "=2.8.4"
notify = "=8.2.1"
rodio = { version = "=0.23.0", default-features = false, features = ["playback", "flac", "mp3", "mp4", "symphonia-alac", "vorbis", "wav"] }
rand = "=0.10.3"
rubato = "=5.0.1"
sha2 = "=0.11.1"
ureq = "=3.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Same version and feature set tauri itself already uses, so no second copy is built. Needed to
# put the desktop subtitle back above the taskbar without ever dropping its top-most flag.
[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_SystemInformation"] }

[dev-dependencies]
tempfile = "=3.27.0"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
